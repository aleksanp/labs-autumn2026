[project]
name = "labs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aleksandr Petrov", email = "petrov.a@delotech.ru" }
]
requires-python = ">=3.11"
dependencies = [
    "dvc>=3.67.1",
    "fastapi>=0.141.1",
    "hyperopt>=0.3.0",
    "joblib>=1.5.3",
    "optuna>=4.9.0",
    "pandas>=3.0.5",
    "prometheus-client>=0.26.0",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
labs = "labs:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]
